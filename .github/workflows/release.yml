name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Numeric version without the v prefix
        required: true
        default: "1.0.001"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            $env:INPUT_VERSION
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build release artifacts
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version "${{ steps.version.outputs.version }}"
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gbaselite-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/GBaseLite-windows-amd64.msi
            dist/gbaselite-windows-amd64.zip
            dist/gbaselite-linux-amd64.tar.gz
            dist/gbaselite-linux-arm64.tar.gz
            dist/gbaselite-linux-amd64
            dist/gbaselite-linux-arm64
            dist/checksums.txt
            dist/sbom.spdx.json
