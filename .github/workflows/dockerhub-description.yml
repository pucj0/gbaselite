name: Docker Hub Description
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: pucj/gbaselite
          short-description: Lightweight database with a MySQL protocol subset and optional MVCC storage.
          readme-filepath: docker/发布说明.md
