name: Test

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
      - name: Test
        run: go test ./... -count=1
      - name: Vet
        run: go vet ./...

  mysql-8-client:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Run MySQL 8 client dump and import smoke test
        shell: bash
        run: bash ./scripts/ci/mysql8-client-smoke.sh

  build:
    strategy:
      matrix:
        include:
          - runner: windows-latest
            goos: windows
            output: gbaselite.exe
          - runner: ubuntu-latest
            goos: linux
            output: gbaselite
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o "${{ matrix.output }}" ./cmd/gbaselite
