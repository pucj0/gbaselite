name: Test

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
      - name: Test
        run: go test ./... -count=1 -timeout 30m
      - name: Vet
        run: go vet ./...
      - name: Failover race regression
        if: runner.os == 'Linux'
        run: go test -race ./failover -count=10 -timeout 30m
      - name: MVCC transaction race regression
        if: runner.os == 'Linux'
        run: go test -race ./mvcc ./storageengine/... ./executor ./server -count=1 -timeout 30m
      # The lock manager is race-tested here rather than locally: it has no C toolchain on the
      # development host, so this step is the only place the shared-request broadcast, the join
      # bookkeeping and the raw-write lock path are exercised under the race detector.
      - name: Lock manager race regression
        if: runner.os == 'Linux'
        run: go test -race ./lockmanager -count=2 -timeout 30m

  mysql-8-client:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Run MySQL 8 client dump and import smoke test
        shell: bash
        run: bash ./scripts/ci/mysql8-client-smoke.sh

  mysql-84-parity:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql84:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: parity_ci_password
          MYSQL_DATABASE: parity_db
        ports:
          - 33066:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Run MySQL 8.4 M01-M44 Parity Suite
        shell: bash
        run: bash ./scripts/ci/mysql84-parity-runner.sh
        env:
          MYSQL_PORT: "33066"
          MYSQL_ROOT_PASSWORD: parity_ci_password
      - name: Upload Parity Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b03-parity-report
          path: .tmp/b03-parity.md

  build:
    strategy:
      matrix:
        include:
          - runner: windows-latest
            goos: windows
            output: gbaselite.exe
          - runner: ubuntu-latest
            goos: linux
            output: gbaselite
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o "${{ matrix.output }}" ./cmd/gbaselite
